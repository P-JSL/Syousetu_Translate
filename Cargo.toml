[package]
name = "syousetu-translate"
version = "0.2.0"
edition = "2021"
description = "Rust web novel translation CLI with optional ezTrans compatibility"
license = "MIT"
default-run = "syousetu-translate"

[features]
default = ["offline-model"]
offline-model = ["dep:candle-core", "dep:candle-nn", "dep:sentencepiece-rs", "dep:rayon"]
gui = ["offline-model", "dep:eframe", "dep:tinyfiledialogs"]

[[bin]]
name = "syousetu-gui"
path = "src/bin/syousetu-gui.rs"
required-features = ["gui"]

[[example]]
name = "benchmark_offline"
required-features = ["offline-model"]

[lib]
name = "syousetu_translate"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
aho-corasick = "1.1"
encoding_rs = "0.8"
fancy-regex = "=0.16.2"
ego-tree = "0.9"
libloading = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "charset"], default-features = false }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
tinyfiledialogs = { version = "3.9", optional = true }
sha2 = "0.10"
candle-core = { version = "=0.11.1", optional = true }
candle-nn = { version = "=0.11.1", optional = true }
sentencepiece-rs = { version = "=0.2.2", optional = true }
rayon = { version = "1.10", optional = true }
fs2 = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
