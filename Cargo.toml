[package]
name = "syousetu-translate"
version = "0.1.0"
edition = "2021"
description = "Rust web novel translation CLI with optional ezTrans compatibility"
license = "MIT"

[lib]
name = "syousetu_translate"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
aho-corasick = "1.1"
encoding_rs = "0.8"
fancy-regex = "=0.16.2"
ego-tree = "0.9"
libloading = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "charset"], default-features = false }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
