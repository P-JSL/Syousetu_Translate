[package]
name = "syousetu-translate"
version = "0.3.4"
edition = "2021"
description = "Rust web novel translation CLI with optional ezTrans compatibility"
license = "MIT"
default-run = "syousetu-translate"

[features]
default = ["offline-model"]
offline-model = ["dep:candle-core", "dep:sentencepiece-rs", "dep:rayon", "dep:gemm"]
model-tools = ["offline-model", "candle-core/safetensors"]
legacy = ["dep:fancy-regex", "dep:libloading"]
gui = ["offline-model", "dep:eframe", "dep:tinyfiledialogs"]

[[bin]]
name = "syousetu-gui"
path = "src/bin/syousetu-gui.rs"
required-features = ["gui"]

[[example]]
name = "benchmark_offline"
required-features = ["offline-model"]

[[example]]
name = "benchmark_projection"
required-features = ["offline-model"]

[[example]]
name = "convert_int8"
required-features = ["model-tools"]

[[example]]
name = "stage_int8_model"
required-features = ["model-tools"]

[lib]
name = "syousetu_translate"
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
aho-corasick = "1.1"
encoding_rs = "0.8"
fancy-regex = { version = "=0.16.2", optional = true }
ego-tree = "0.9"
libloading = { version = "0.8", optional = true }
regex = "1"
reqwest = { version = "0.12", features = ["blocking"], default-features = false }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
tinyfiledialogs = { version = "3.9", optional = true }
sha2 = "0.10"
candle-core = { version = "=0.11.1", optional = true, default-features = false }
sentencepiece-rs = { version = "=0.2.2", optional = true }
rayon = { version = "1.10", optional = true }
gemm = { version = "=0.19.0", optional = true, features = ["wasm-simd128-enable"] }
fs2 = "0.4"
miniz_oxide = "=0.9.1"

[target.'cfg(windows)'.dependencies]
# Schannel uses the user's Windows certificate store (including trusted
# antivirus/corporate roots), with normal chain and hostname verification.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[profile.release]
lto = "thin"
codegen-units = 8
panic = "unwind"
strip = "symbols"

[patch.crates-io]
# Preserve Q8 arithmetic while specializing CPU batching and optional adapters.
candle-core = { path = "vendor/candle-core" }
