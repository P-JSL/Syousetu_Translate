[package]
name = "syousetu-release-package"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["package"]
package = ["dep:reqwest"]

# This separate maintainer executable never becomes an application dependency.
[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
strip = "symbols"

