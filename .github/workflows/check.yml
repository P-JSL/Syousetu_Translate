name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CANDLE_NUM_THREADS: 1

jobs:
  # Platform builds and lint run concurrently. Tests and shipping executables
  # reuse the same optimized dependency artifacts on each platform.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: production-${{ matrix.os }}
      - name: Verify installer and package rules with synthetic fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test production features
        run: cargo test --locked --release --features gui --all-targets
      - name: Verify Hugging Face TLS with the Windows trust store
        if: runner.os == 'Windows'
        run: cargo test --locked --release --features gui --lib pinned_huggingface_config_uses_platform_trust -- --ignored
      - name: Build shipping executables
        run: cargo build --locked --release --features gui --bins
      - name: Stage only application files and licenses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/web-client/licenses | Out-Null
          Copy-Item target/release/syousetu-gui.exe dist/web-client/
          Copy-Item target/release/syousetu-translate.exe dist/web-client/
          Copy-Item '웹소설 번역기.bat' dist/web-client/
          Copy-Item docs/windows-web-client.md dist/web-client/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/web-client/
          Copy-Item licenses/Apache-2.0.txt,licenses/MIT-SMaLL100.txt,licenses/MIT-gacha-pickup-calculator.txt dist/web-client/licenses/
          python scripts/verify_web_artifact.py dist/web-client
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SyousetuTranslate-Web-Windows-x64
          path: dist/web-client/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-linux
      - run: cargo clippy --locked --features gui --all-targets -- -D warnings

  legacy:
    # The recovery tools are opt-in and never uploaded with production files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-linux
      - run: cargo test --locked --no-default-features --features legacy --all-targets
