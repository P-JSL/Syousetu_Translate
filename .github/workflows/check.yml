name: Rust CI
on:
  push:
  pull_request:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Verify local engine installer with synthetic fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - run: cargo test --lib
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: SyousetuTranslate-Windows-x86
          path: |
            target/i686-pc-windows-msvc/release/syousetu-translate.exe
            target/i686-pc-windows-msvc/release/syousetu_translate.dll
          if-no-files-found: error

  live-site-smoke:
    name: Live site smoke tests (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Kakuyomu work index
        continue-on-error: true
        run: cargo run -- inspect --url https://kakuyomu.jp/works/2912051603596422650
      - name: Kakuyomu chapter 1 (passthrough only)
        continue-on-error: true
        run: cargo run -- download --url https://kakuyomu.jp/works/2912051603596422650 --out kakuyomu-first.txt --start 1 --end 1 --passthrough
      - name: Alphapolis work index
        continue-on-error: true
        run: cargo run -- inspect --url https://www.alphapolis.co.jp/novel/767156331/284095783
      - name: Alphapolis chapter 1 (passthrough only)
        continue-on-error: true
        run: cargo run -- download --url https://www.alphapolis.co.jp/novel/767156331/284095783 --out alphapolis-first.txt --start 1 --end 1 --passthrough
