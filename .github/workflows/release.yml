name: Stage web release assets

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Portable application, prepared model, or Windows offline validation
        type: choice
        options: [web, model, model-smoke, portable-smoke]
        default: web
      tag:
        description: Existing release tag
        required: true
        type: string
      run_id:
        description: Successful Rust CI run for the exact source commit
        required: true
        type: string
      package_run_id:
        description: Successful web staging run (portable-smoke only)
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: web-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  stage:
    if: inputs.kind == 'web' || !inputs.kind
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/release_package
          shared-key: portable-packager-linux
          cache-on-failure: true
      - name: Validate tag, successful CI, draft and artifact source (Rust)
        id: verify
        run: cargo run --locked --release --manifest-path tools/release_package/Cargo.toml -- stage-web "$RELEASE_TAG" "$CI_RUN_ID"
      - name: Use verified source for packaging
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
        run: git checkout --detach "$SOURCE_SHA"
      - uses: actions/download-artifact@v7
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: build/web-client
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package application and prepared INT8 for immediate offline use (Rust)
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
        run: cargo run --locked --release --manifest-path tools/release_package/Cargo.toml -- package-web build/web-client release-artifact.json dist/release "$RELEASE_TAG" "$SOURCE_SHA" "$CI_RUN_ID" build/model-cache
      - name: Upload portable ZIP and checksums to the verified draft
        run: gh release upload "$RELEASE_TAG" dist/release/*.zip dist/release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Share the identical candidate with read-only Windows validation
        uses: actions/upload-artifact@v6
        with:
          name: SyousetuTranslate-Portable-${{ inputs.tag }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  model:
    if: inputs.kind == 'model'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDLE_NUM_THREADS: 1
      MODEL_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: model-export-linux
          cache-on-failure: true
      - name: Validate source and produce the immutable INT8 model (Rust)
        run: cargo run --locked --release --features model-tools --example stage_int8_model -- model-source dist/int8-model "$MODEL_TAG" "$CI_RUN_ID"
      - name: Upload model and license to the verified draft
        run: gh release upload "$MODEL_TAG" dist/int8-model/model-int8.gguf dist/int8-model/LICENSE-MIT-SMaLL100.txt dist/int8-model/MODEL_CARD.md dist/int8-model/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  model-smoke:
    if: inputs.kind == 'model-smoke'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate the prebuilt CLI source (Rust, no app rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.run_id }}
        run: |
          rustc --edition=2021 tools/release_audit.rs -o release-audit.exe
          ./release-audit.exe check-ci "$env:CI_RUN_ID"
      - uses: actions/download-artifact@v7
        with:
          name: SyousetuTranslate-Web-Windows-x64
          path: web-client
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prepared INT8 and translate offline on Windows (Rust)
        run: ./release-audit.exe model-smoke web-client/syousetu-translate.exe fresh-model
      - name: Verify bundled model auto-selection from another working folder (Rust)
        run: ./release-audit.exe portable web-client fresh-model portable-work

  portable-smoke:
    if: inputs.kind == 'portable-smoke'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/release_package
          shared-key: portable-verifier-windows
      - name: Validate the prebuilt application source (Rust, no app rebuild)
        run: |
          rustc --edition=2021 tools/release_audit.rs -o release-audit.exe
          ./release-audit.exe check-ci "$env:CI_RUN_ID"
      - uses: actions/download-artifact@v7
        with:
          name: SyousetuTranslate-Web-Windows-x64
          path: expected-client
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the identical staged ZIP with read-only Actions access
        uses: actions/download-artifact@v7
        with:
          name: SyousetuTranslate-Portable-${{ inputs.tag }}
          path: staged-release
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and unpack the exact portable release (Rust, archive dependencies only)
        run: |
          $archive = Get-ChildItem staged-release/*.zip
          if (@($archive).Count -ne 1) { throw 'Expected exactly one portable archive' }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve checked-out release source' }
          cargo run --locked --release --no-default-features --manifest-path tools/release_package/Cargo.toml -- verify-portable $archive.FullName staged-release/SHA256SUMS.txt unpacked-release expected-client "$source"
      - name: Run Japanese to Korean with the bundled model from another folder
        run: ./release-audit.exe portable-existing unpacked-release portable-work
