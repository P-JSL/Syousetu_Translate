name: Stage web release assets

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Application ZIP or maintainer-prepared INT8 model
        type: choice
        options: [web, model, model-smoke]
        default: web
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
      run_id:
        description: Successful Rust CI run for the exact tagged commit
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: web-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  stage:
    if: inputs.kind == 'web' || !inputs.kind
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Verify tagged source and successful platform builds
        id: verify
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag, run_id = os.environ['RELEASE_TAG'], os.environ['CI_RUN_ID']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag)
          assert run_id.isdigit() and int(run_id) > 0
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          subprocess.check_call(['git', 'fetch', '--no-tags', '--depth=1', 'origin', f'refs/tags/{tag}:refs/tags/{tag}'])
          source = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', source)
          run = api(f'actions/runs/{run_id}')
          assert run['name'] == 'Rust CI'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == source
          jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
          required = {'checks (ubuntu-latest)', 'checks (windows-latest)'}
          required |= {"lint", "legacy"} if "lint" in {j["name"] for j in jobs} else set()
          assert required <= {j['name'] for j in jobs if j['conclusion'] == 'success'}
          # Tag lookup returns published releases; locate drafts in the list.
          releases = [r for r in api('releases?per_page=100') if r['tag_name'] == tag]
          assert len(releases) == 1, 'Expected exactly one release draft for this tag'
          release = releases[0]
          assert release['draft'], 'Only unpublished draft assets may be replaced'
          artifacts = api(f'actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          matches = [a for a in artifacts if a['name'] in ['SyousetuTranslate-Web-Windows-x86', 'SyousetuTranslate-Web-Windows-x64'] and not a['expired']]
          assert len(matches) == 1
          assert matches[0]['workflow_run']['head_sha'] == source
          Path('release-artifact.json').write_text(json.dumps(matches[0]))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'source_sha={source}\n')
              output.write(f'artifact_name={matches[0]["name"]}\n')
          PY
      - name: Use verified source for packaging rules
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
        run: git checkout --detach "$SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: build/web-client
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and package the web client
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
        run: |
          python3 scripts/package_web_release.py --artifact-dir build/web-client --metadata release-artifact.json --output-dir dist/release --version "$RELEASE_TAG" --source-commit "$SOURCE_SHA" --run-id "$CI_RUN_ID"
      - name: Upload assets to the existing draft
        run: |
          gh release upload "$RELEASE_TAG" dist/release/*.zip dist/release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  model:
    if: inputs.kind == 'model'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDLE_NUM_THREADS: 1
      MODEL_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: model-export-linux
          cache-on-failure: true
      - name: Validate source and produce the immutable INT8 model (Rust)
        run: cargo run --locked --release --features model-tools --example stage_int8_model -- model-source dist/int8-model "$MODEL_TAG" "$CI_RUN_ID"
      - name: Upload model and license to the verified draft
        run: gh release upload "$MODEL_TAG" dist/int8-model/model-int8.gguf dist/int8-model/LICENSE-MIT-SMaLL100.txt dist/int8-model/MODEL_CARD.md dist/int8-model/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  model-smoke:
    if: inputs.kind == 'model-smoke'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate the prebuilt CLI source (Rust, no app rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.run_id }}
        run: |
          rustc --edition=2021 tools/release_audit.rs -o release-audit.exe
          ./release-audit.exe check-ci "$env:CI_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: SyousetuTranslate-Web-Windows-x64
          path: web-client
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prepared INT8 and translate offline on Windows (Rust)
        run: ./release-audit.exe model-smoke web-client/syousetu-translate.exe fresh-model
